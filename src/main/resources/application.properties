# -----------------------------------------------------------------------------
# Configuration Générale de l'Application
# -----------------------------------------------------------------------------
spring.config.import=optional:file:.env[.properties]
spring.application.name=${APP_NAME:communaute-backend}

# Render fournit le port via la variable PORT. SERVER_PORT reste utilisable en local.
server.port=${PORT:${SERVER_PORT:8080}}
# Autorise les appareils du réseau local (notamment le téléphone Android)
server.address=0.0.0.0

# -----------------------------------------------------------------------------
# Source de Données (PostgreSQL Neon)
# -----------------------------------------------------------------------------
# REMARQUE : Assurez-vous que votre variable ${DB_URL} sur Render commence par "jdbc:postgresql://" 
# et se termine par "?sslmode=require" (Ex: jdbc:postgresql://votre-host.neon.tech/neondb?sslmode=require)
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# -----------------------------------------------------------------------------
# JPA / Hibernate
# -----------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Initialisation et migration de la base de données
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V20260818__remove_profile_image.sql,classpath:db/migration/V20260822__add_chat_read_status.sql

# -----------------------------------------------------------------------------
# Pool de Connexion HikariCP (Optimisé pour le Scale-to-Zero de Neon)
# -----------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
# 30 secondes d'attente maximum pour laisser le temps à Neon de sortir de veille
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=300000

# -----------------------------------------------------------------------------
# Sécurité & JWT
# -----------------------------------------------------------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# -----------------------------------------------------------------------------
# Gestion des CORS
# -----------------------------------------------------------------------------
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# -----------------------------------------------------------------------------
# Journalisation (Logging) & Optimisations Spring
# -----------------------------------------------------------------------------
logging.level.org.springframework.security=INFO
://level.com.reseausocial.group=DEBUG
spring.main.allow-bean-definition-overriding=false
spring.main.lazy-initialization=true
spring.devtools.restart.enabled=false

# Limites de téléversement de fichiers
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
